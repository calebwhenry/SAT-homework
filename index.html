<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subject & Verb Practice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232f5bea%22/%3E%3Crect x=%2216%22 y=%2216%22 width=%2212%22 height=%2210%22 rx=%223%22 fill=%22%23f2b705%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sign in / create account -->
  <section id="auth" class="screen center" hidden>
    <form id="auth-form" class="card auth-card" novalidate>
      <h1 class="auth-title">Subject &amp; Verb Practice</h1>
      <p class="muted">Find the simple subject and simple predicate in 55 SAT-style sentences.</p>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" data-mode="signin" aria-selected="true">Sign in</button>
        <button type="button" role="tab" class="tab" data-mode="signup" aria-selected="false">Create account</button>
      </div>
      <label class="field" id="name-field" hidden>Your full name
        <input id="name" name="name" autocomplete="name" maxlength="80">
      </label>
      <label class="field">Email
        <input id="email" name="email" type="email" autocomplete="email" required>
      </label>
      <label class="field">Password
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
      </label>
      <p id="auth-error" class="error" role="alert" hidden></p>
      <button id="auth-submit" class="btn primary wide" type="submit">Sign in</button>
    </form>
  </section>

  <!-- Name prompt for accounts without a profile -->
  <section id="profile" class="screen center" hidden>
    <form id="profile-form" class="card auth-card">
      <h1 class="auth-title">What's your name?</h1>
      <p class="muted">Your teacher sees this next to your scores.</p>
      <label class="field">Full name
        <input id="profile-name" autocomplete="name" maxlength="80" required>
      </label>
      <p id="profile-error" class="error" role="alert" hidden></p>
      <button class="btn primary wide" type="submit">Start practicing</button>
    </form>
  </section>

  <!-- Practice -->
  <section id="practice" class="screen practice" hidden>
    <header class="topbar">
      <div class="brand">Subject &amp; Verb Practice</div>
      <div class="who"><span id="who-name"></span> <button id="sign-out" class="link">Sign out</button></div>
    </header>

    <nav id="strip" class="strip" aria-label="Questions"></nav>

    <main class="sheet">
      <div class="sheet-head">
        <span id="q-count" class="q-count"></span>
        <span id="q-set" class="q-set"></span>
      </div>

      <div class="steps" role="group" aria-label="Answer steps">
        <button id="step-s" class="step" data-step="subject">
          <span class="step-n">1</span>
          <span class="step-text"><span class="step-label">Simple subject</span><span class="step-pick" id="pick-s">Click a word</span></span>
        </button>
        <button id="step-p" class="step" data-step="predicate">
          <span class="step-n">2</span>
          <span class="step-text"><span class="step-label">Verb (simple predicate)</span><span class="step-pick" id="pick-p">Click a word</span></span>
        </button>
      </div>

      <p id="prompt" class="prompt" aria-live="polite"></p>

      <div id="sentence" class="sentence"></div>

      <div id="feedback" class="feedback" aria-live="polite" hidden></div>
    </main>

    <footer class="controls">
      <button id="back" class="btn">Back</button>
      <div class="controls-mid">
        <button id="continue" class="btn guide" hidden>Continue to verb</button>
        <button id="submit" class="btn primary" disabled>Submit</button>
      </div>
      <button id="next" class="btn">Next</button>
    </footer>
  </section>

  <!-- Finished -->
  <section id="done" class="screen center" hidden>
    <div class="card done-card">
      <h1 class="auth-title">All 55 answered</h1>
      <p id="done-score" class="done-score"></p>
      <p id="done-detail" class="muted"></p>
      <button id="review" class="btn primary">Review my answers</button>
    </div>
  </section>

  <div id="loading" class="screen center"><p class="muted">Loading…</p></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
